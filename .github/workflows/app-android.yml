name: App Android

# Gera o arquivo .aab do app "Coletinho" para enviar ao Google Play.
# Como usar: Actions > App Android > Run workflow. No fim, baixe "coletinho-aab"
# em Artifacts e envie o .aab no Play Console.
# O app é uma "Trusted Web Activity": abre o site coletinho.com.br, então mudanças
# no site não precisam de versão nova na loja. Só rode isto ao mudar algo em android/.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/app-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Senha da chave de upload. Sem ela o .aab sai sem assinatura (só para conferir que compila).
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # Cada envio ao Google Play precisa de um número de versão maior que o anterior.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Abrir a chave de upload
        if: env.KEYSTORE_PASSWORD != ''
        run: |
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$KEYSTORE_PASSWORD" \
            --decrypt -o "$RUNNER_TEMP/upload.jks" android/upload-keystore.jks.gpg
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gerar o .aab
        working-directory: android
        run: gradle --no-daemon bundleRelease

      - name: Conferir assinatura
        if: env.KEYSTORE_PASSWORD != ''
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "SHA256:"

      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_PASSWORD != ''
        with:
          name: coletinho-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
